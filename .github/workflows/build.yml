name: Build and Deploy Site

on:
  # Horas NOMINALES. GitHub dispara los `schedule` de este repo con ~5 h de
  # retraso sistematico (medido 2026-08-29..09-11: el cron de las 01:37 UTC
  # corria a las 06:12-06:40 UTC, y los otros dos con el mismo desfase), asi
  # que la web no estaba lista hasta las 08:15-08:45 Madrid. Las ventanas
  # empiezan justo tras la medianoche de Madrid para que, con ese retraso,
  # la primera aterrice hacia las 05:00 Madrid; las tres ultimas son la red
  # de seguridad de siempre. `generate_site.py` calcula `today` en
  # Europe/Madrid, y el job `check` salta el build cuando el dia ya esta
  # publicado, asi que una ventana que cae ANTES de medianoche en Madrid
  # (22:03 UTC en invierno = 23:03 CET) no rompe nada: comprueba y se va.
  schedule:
    - cron: '3 22 * * *'   # 00:03 Madrid en verano (23:03 del dia anterior en invierno: solo comprueba)
    - cron: '11 23 * * *'  # 01:11 Madrid (00:11 en invierno)
    - cron: '19 0 * * *'   # 02:19 Madrid (01:19 en invierno)
    - cron: '37 1 * * *'   # 03:37 Madrid (02:37 en invierno)
    - cron: '40 2 * * *'   # 04:40 Madrid (03:40 en invierno)
    - cron: '21 3 * * *'   # 05:21 Madrid (04:21 en invierno)
  push:
    branches: [master]
    paths:
      - 'liturgia.py'
      - 'book_codex.py'
      - 'book_abbr_eu.py'
      - 'liturgical_names_eu.py'
      - 'i18n.py'
      - 'data/**'
      - 'generate_site.py'
      - 'templates/**'
      - 'assets/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Los tres crons son disparadores independientes: GitHub los lanza todos, no
  # "el primero que consiga publicar". Este job evita el trabajo redundante
  # comparando la fecha YA PUBLICADA (JSON-LD `dateModified` del sitio vivo)
  # con hoy en Madrid. La senal es el propio artefacto desplegado, no un
  # chivato aparte: si el deploy fallo, la fecha esta vieja y el build corre.
  # Solo aplica a `schedule` — un push o un dispatch cambian codigo y siempre
  # deben reconstruir, aunque la fecha ya sea la de hoy.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decidir si hace falta reconstruir
        id: decide
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "Evento $EVENT: se reconstruye siempre."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOY=$(TZ=Europe/Madrid date +%F)
          PUB=$(curl -sS --max-time 20 https://lecturasdeldia.org/                 | grep -oE '"dateModified": *"[0-9]{4}-[0-9]{2}-[0-9]{2}"'                 | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}') || true
          echo "Publicado: '${PUB:-<no leido>}' | Hoy en Madrid: '$HOY'"
          # Fail-open deliberado: solo se salta el build cuando se ha LEIDO
          # afirmativamente la fecha de hoy. Vacio, timeout o JSON-LD cambiado
          # reconstruyen. Un build de mas cuesta 35s; una portada congelada la
          # ve todo el mundo y nadie vigila el sitio.
          if [ -n "$PUB" ] && [ "$PUB" = "$HOY" ]; then
            echo "Ya publicado el dia de hoy: no se reconstruye."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Falta publicar hoy (o no se pudo leer): se reconstruye."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build site
        run: python generate_site.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
